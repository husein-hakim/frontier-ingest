services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: frontier
      POSTGRES_USER: frontier
      POSTGRES_PASSWORD: frontier-local
    ports:
      - "5432:5432"
    volumes:
      - frontier_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontier -d frontier"]
      interval: 5s
      timeout: 3s
      retries: 10

  producer:
    build: .
    environment:
      DATABASE_URL: postgresql://frontier:frontier-local@postgres:5432/frontier
      RAW_STORE_PATH: /data/raw
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
    volumes:
      - frontier_raw:/data/raw
      - ./outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
    command:
      ["produce-all", "--catalog-limit", "1000", "--signal-limit", "500", "--queue-name", "submission"]

  worker:
    build: .
    environment:
      DATABASE_URL: postgresql://frontier:frontier-local@postgres:5432/frontier
      RAW_STORE_PATH: /data/raw
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ENABLE_LLM_ENRICHMENT: ${ENABLE_LLM_ENRICHMENT:-false}
      PRIMARY_LLM_API_KEY: ${PRIMARY_LLM_API_KEY:-}
      PRIMARY_LLM_BASE_URL: ${PRIMARY_LLM_BASE_URL:-}
      PRIMARY_LLM_MODEL: ${PRIMARY_LLM_MODEL:-}
      SECONDARY_LLM_API_KEY: ${SECONDARY_LLM_API_KEY:-}
      SECONDARY_LLM_BASE_URL: ${SECONDARY_LLM_BASE_URL:-}
      SECONDARY_LLM_MODEL: ${SECONDARY_LLM_MODEL:-}
      TERTIARY_LLM_API_KEY: ${TERTIARY_LLM_API_KEY:-}
      TERTIARY_LLM_BASE_URL: ${TERTIARY_LLM_BASE_URL:-}
      TERTIARY_LLM_MODEL: ${TERTIARY_LLM_MODEL:-}
    volumes:
      - frontier_raw:/data/raw
      - ./outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
    command:
      ["work", "--queue-name", "submission", "--batch-size", "100", "--idle-polls", "60", "--poll-interval", "2"]

volumes:
  frontier_postgres:
  frontier_raw:
