[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "frontier-ingest"
version = "0.2.0"
description = "Evidence-first ingestion pipeline for AI ecosystem intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]
postgres = ["asyncpg>=0.30,<1"]

[project.scripts]
frontier-ingest = "frontier_ingest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/frontier_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
